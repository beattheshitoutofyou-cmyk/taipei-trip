<style>
:root{--ink:#eef0f7;--paper:#0d0f1a;--red:#ff3d8b;--line:#2a3050}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:380px;background:#161a2b;border:1px solid var(--line);border-radius:18px;padding:32px 26px;box-shadow:0 10px 30px rgba(31,42,68,.08);text-align:center}
.sun{width:44px;height:44px;border-radius:50%;background:var(--red);margin:0 auto 16px}
h1{font-family:"Noto Serif TC","Songti TC",serif;font-size:24px;margin:0 0 6px;letter-spacing:.04em}
p{margin:0 0 22px;color:#a3a9c2;font-size:15px;line-height:1.6}
input[type=password]{width:100%;font-size:17px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#0d0f1a;color:var(--ink);outline:none}
input[type=password]:focus{border-color:var(--ink)}
label.r{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 18px;font-size:14px;color:#a3a9c2}
button{width:100%;font-size:17px;padding:13px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:12px}
</style></head><body>
